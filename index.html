<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PeTTa Playground — MeTTa in the Browser</title>
    <meta name="description" content="Run MeTTa code directly in your browser using PeTTa and SWI-Prolog WebAssembly. No server needed.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Styles -->
  <script type="module" crossorigin src="/petta-playground/assets/index-sgUzQu8v.js"></script>
  <link rel="stylesheet" crossorigin href="/petta-playground/assets/index-Cw_kGCqG.css">
</head>
<body>
    <!-- Background glow effects -->
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>
    <div class="bg-glow bg-glow-3"></div>

    <!-- Header -->
    <header class="header" id="header">
        <div class="header-left">
            <div class="logo">
                <span class="logo-icon">λ</span>
                <div class="logo-text">
                    <h1>PeTTa <span class="accent">Playground</span></h1>
                    <p class="subtitle">MeTTa in the Browser via WebAssembly</p>
                </div>
            </div>
        </div>
        <div class="header-right">
            <div class="status-indicator" id="statusIndicator">
                <div class="status-dot" id="statusDot"></div>
                <span class="status-text" id="statusText">Initializing...</span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content" id="mainContent">
        <!-- Editor Panel -->
        <section class="panel editor-panel" id="editorPanel">
            <div class="panel-header">
                <div class="panel-title">
                    <svg class="panel-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="16 18 22 12 16 6"></polyline>
                        <polyline points="8 6 2 12 8 18"></polyline>
                    </svg>
                    <span>Editor</span>
                </div>
                <div class="panel-actions">
                    <div class="example-select-wrapper">
                        <select id="examplesSelect" class="example-select">
                            <option value="">Load Example...</option>
                            <optgroup label="Basics">
                                <option value="hello">Hello World</option>
                                <option value="arithmetic">Arithmetic</option>
                                <option value="identity">Identity Function</option>
                            </optgroup>
                            <optgroup label="Functions">
                                <option value="factorial">Factorial</option>
                                <option value="fibonacci">Fibonacci</option>
                                <option value="peano">Peano Arithmetic</option>
                            </optgroup>
                            <optgroup label="Advanced">
                                <option value="pattern_matching">Pattern Matching</option>
                                <option value="superpose">Nondeterminism</option>
                                <option value="higher_order">Higher-Order Functions</option>
                                <option value="logic">Logic Programming</option>
                                <option value="types">Type System</option>
                            </optgroup>
                        </select>
                    </div>
                </div>
            </div>
            <div class="editor-container" id="editor">
            </div>
        </section>

        <!-- Controls Bar -->
        <div class="controls-bar" id="controlsBar">
            <button class="btn btn-run" id="runBtn" disabled>
                <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
                    <polygon points="5 3 19 12 5 21 5 3"></polygon>
                </svg>
                <span>Run</span>
                <kbd class="shortcut">Ctrl+Enter</kbd>
            </button>
            <button class="btn btn-clear" id="clearBtn">
                <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 6h18"></path>
                    <path d="M8 6V4h8v2"></path>
                    <path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6"></path>
                </svg>
                <span>Clear Output</span>
            </button>
            <div class="controls-spacer">
                <div class="theme-select-wrapper" style="margin-left: 12px; display: inline-block;">
                    <select id="themeSelect" class="example-select">
                        <option value="dark" selected>Dark Theme</option>
                        <option value="light">Light Theme</option>
                    </select>
                </div>
            </div>
            <div class="execution-time" id="executionTime"></div>
        </div>

        <!-- Output Panel -->
        <section class="panel output-panel" id="outputPanel">
            <div class="panel-header">
                <div class="panel-title">
                    <svg class="panel-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2"></rect>
                        <path d="M9 9l3 3-3 3"></path>
                        <path d="M14 15h3"></path>
                    </svg>
                    <span>Output</span>
                </div>
                <div class="panel-actions">
                    <span class="output-badge" id="outputBadge"></span>
                </div>
            </div>
            <div class="output-container" id="outputContainer">
                <div class="output-content" id="outputContent">
                    <div class="output-placeholder">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="placeholder-icon">
                            <circle cx="12" cy="12" r="10"></circle>
                            <path d="M8 14s1.5 2 4 2 4-2 4-2"></path>
                            <line x1="9" y1="9" x2="9.01" y2="9"></line>
                            <line x1="15" y1="9" x2="15.01" y2="9"></line>
                        </svg>
                        <p>Run your code to see results here</p>
                        <span class="placeholder-hint">Press <kbd>Ctrl+Enter</kbd> or click <strong>Run</strong></span>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content">
            <div class="loading-spinner">
                <div class="spinner-ring"></div>
                <span class="spinner-icon">λ</span>
            </div>
            <h2>Loading PeTTa Runtime</h2>
            <p class="loading-step" id="loadingStep">Downloading SWI-Prolog WebAssembly...</p>
            <div class="loading-progress">
                <div class="progress-bar" id="progressBar"></div>
            </div>
        </div>
    </div>

    <!-- App -->
</body>
</html>
